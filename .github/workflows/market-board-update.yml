name: Refresh public gold market board

on:
  schedule:
    # Bangkok 08:00 and 22:00 daily; GitHub Actions cron is UTC.
    - cron: '0 1,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect market data and generate scheduled analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          GOLDPRICE_DEV_API_KEY: ${{ secrets.GOLDPRICE_DEV_API_KEY }}
        run: python scripts/update_market_board.py
      - name: Publish updated data for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-analysis.json index.html news.html
          if git diff --cached --quiet; then
            echo "Market data did not change; nothing to publish."
          else
            git commit -m "Refresh scheduled gold market analysis"
            git push
          fi
